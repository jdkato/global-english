# A contraction is one more form for a reader, and for a translation tool,
# to resolve. Written out, the negation cannot be missed.
extends: substitution
message: "Write out '%[2]s' as %[1]s."
level: suggestion
ignorecase: true
matchcase: true
action:
  name: replace
swap:
  aren['’]t: are not
  can['’]t: cannot
  couldn['’]t: could not
  didn['’]t: did not
  doesn['’]t: does not
  don['’]t: do not
  hadn['’]t: had not
  hasn['’]t: has not
  haven['’]t: have not
  isn['’]t: is not
  mustn['’]t: must not
  shouldn['’]t: should not
  wasn['’]t: was not
  weren['’]t: were not
  won['’]t: will not
  wouldn['’]t: would not
  it['’]s: it is
  that['’]s: that is
  there['’]s: there is
  here['’]s: here is
  what['’]s: what is
  who['’]s: who is
  let['’]s: let us
  I['’]m: I am
  I['’]ve: I have
  I['’]ll: I will
  I['’]d: I would
  you['’]re: you are
  you['’]ve: you have
  you['’]ll: you will
  you['’]d: you would
  we['’]re: we are
  we['’]ve: we have
  we['’]ll: we will
  they['’]re: they are
  they['’]ve: they have
  they['’]ll: they will
  it['’]ll: it will

tests:
  - name: fires
    input: |
      Don't restart the server; it's already running and you'll lose the cache.
    want: |
      1:1:Strict.Contractions:Write out 'Don't' as 'Do not'.
      1:27:Strict.Contractions:Write out 'it's' as 'it is'.
      1:52:Strict.Contractions:Write out 'you'll' as 'you will'.
  - name: clean
    input: |
      Do not restart the server; it is already running. The server's cache is kept.
    want: ""
