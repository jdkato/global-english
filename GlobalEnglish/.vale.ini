# The core is on by default. Strict, which asks for no contractions and
# shorter sentences, is opt-in; name it beside the core in your own config:
#
#   [*.md]
#   BasedOnStyles = GlobalEnglish, Strict
#
# Std is the standard library the Latin and sentence-length rules extend;
# sync pulls it in, and it stays present without being enabled.
Packages = https://github.com/vale-cli/Std/releases/latest/download/Std.zip
MinAlertLevel = suggestion

[*.{md,txt,org,rst,adoc,html}]
BasedOnStyles = GlobalEnglish
