# The core is on by default. Strict (no contractions, shorter sentences) and
# Controlled (procedures and maintenance text) are opt-in; name them beside
# the core in your own config:
#
#   [*.md]
#   BasedOnStyles = GlobalEnglish, Strict, Controlled
#
# ControlledVocabulary.Approved needs an Approved dictionary you supply in
# config/dictionaries, and Vale stops with an error without one, so it is
# never on until you name it.
#
# Std is the standard library the Latin, sentence-length, and passive rules
# extend; sync pulls it in, and it stays present without being enabled.
Packages = https://github.com/vale-cli/Std/releases/latest/download/Std.zip
MinAlertLevel = suggestion

[*.{md,txt,org,rst,adoc,html}]
BasedOnStyles = GlobalEnglish
