# The configs the README tells you to write, one per fixture, with the
# package's styles read from the tree instead of a sync.
StylesPath = GlobalEnglish/styles
MinAlertLevel = suggestion

[{fixtures,fixtures/clean}/page.md]
BasedOnStyles = GlobalEnglish, Strict

[{fixtures,fixtures/clean}/page.rst]
BasedOnStyles = GlobalEnglish, Strict

[{fixtures,fixtures/clean}/procedure.md]
BasedOnStyles = GlobalEnglish, Strict, Controlled

# The approved vocabulary reads a dictionary the user supplies; test.sh
# copies a tiny one from fixtures/dictionaries onto the StylesPath.
[{fixtures,fixtures/clean}/approved.md]
BasedOnStyles = ControlledVocabulary
